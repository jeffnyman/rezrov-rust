name: Release-plz

# Both commands are dispatched by hand, and the input below picks which one
# runs. Nothing in this file fires on a merge.
#
# release-pr opens the release PR: that button press is the "cut a release"
# moment, and until you press it no release PR exists. Leaving it on `push`
# would keep one open permanently, rewriting itself as commits land.
#
# release acts on the squashed release commit once you merge that PR. It used
# to run on every push to main, on the assumption it would find nothing to do.
# That assumption only held while every crate was already on crates.io, so
# adding a crate published it the moment it landed. Dispatching it makes a
# release something you decide to do rather than something that happens.
on:
  workflow_dispatch:
    inputs:
      command:
        description: Which release-plz command to run
        type: choice
        options: [release-pr, release]
        default: release-pr

# No ambient permissions; each job takes only what it needs.
permissions: {}

jobs:
  # Opens the release PR: bumps the version in Cargo.toml and builds
  # CHANGELOG.md from the conventional commits since the last release. Its
  # default title is "chore: release v<version>", which pr-title.yml accepts.
  release-pr:
    name: release-pr
    if: inputs.command == 'release-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Guards against two dispatches racing to write the same release branch.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # release-plz derives the version from history, so it needs all of
          # it, not the default shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.133
        with:
          command: release-pr
        env:
          # A fine-grained PAT rather than the default token. main requires
          # status checks, and a PR opened with GITHUB_TOKEN cannot start
          # workflow runs, so this PR's checks would sit pending forever and
          # it would never merge. The variable name stays GITHUB_TOKEN because
          # that is what the action reads; only the secret behind it changes.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Dispatch this once the release PR is squashed into main: it tags that
  # commit, cuts a GitHub Release, and publishes to crates.io. Creating tags is
  # all this needs, which a Release Tags ruleset forbidding update/deletion
  # still allows. It publishes any crate whose version is not on crates.io yet,
  # so only run it when that is what you want.
  release:
    name: release
    if: inputs.command == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.133
        with:
          command: release
        env:
          # The default token is enough here: this job tags, releases and
          # publishes, and needs to trigger no further workflow.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
