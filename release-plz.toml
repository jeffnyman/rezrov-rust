# Nothing here is ready to be released, but the release job runs on every push
# to main by design, and it publishes any crate whose manifest version is not
# already on crates.io. With every crate sitting at the placeholder 0.0.0, that
# means each new crate gets published the moment it lands, without anyone
# asking for a release.
#
# This switch turns the whole thing off. release-plz skips the packages
# entirely: no cargo publish, no git tag, no GitHub release. Remove it when
# there is something worth cutting a real version for, and the dispatch-driven
# release PR flow in .github/workflows/release-plz.yml works as intended.
[workspace]
release = false
